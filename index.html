<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mimosa AR</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2213%22>🟡</text></svg>">
  <link rel="stylesheet" href="/src/style.css">
  <!-- A-Frame sert aussi la prévisualisation 3D de l'accueil (sans 8th Wall). -->
  <script src="external/aframe/aframe-master.min.js"></script>
</head>
<body class="home">
  <main>
    <h1>Mimosa AR</h1>
    <p>Expérience de réalité augmentée web, propulsée par le moteur 8th Wall.</p>
    <!-- Le CTA n'est activé qu'une fois le modèle 3D en cache (src/home.js). -->
    <a class="cta" id="cta" href="ar.html" aria-disabled="true">
      <span id="cta-label">Préparation…</span>
    </a>

    <div id="progress" role="progressbar" aria-label="Chargement du modèle 3D"
         aria-valuemin="0" aria-valuemax="100">
      <div id="progress-bar"></div>
    </div>

    <a id="tutorial" href="how-to.pdf" download="how-to.pdf">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v11m0 0 4-4m-4 4-4-4M4 19h16"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>
        <b>Télécharger le tuto</b>
        <em>PDF A4, 3 pages — visuel à imprimer inclus</em>
      </span>
    </a>

    <section id="preview" aria-label="Prévisualisation du modèle 3D">
      <div id="viewer">
        <a-scene
          embedded
          vr-mode-ui="enabled: false"
          xr-mode-ui="enabled: false"
          device-orientation-permission-ui="enabled: false"
          renderer="colorManagement: true; antialias: true">
          <a-light type="hemisphere" color="#eaf2ff" ground-color="#8a6f4a" intensity="2.2"></a-light>
          <a-light type="directional" intensity="2.8" position="1.5 4 2.5"></a-light>
          <a-light type="directional" intensity="1" position="-2 1.5 -1.5"></a-light>
          <!-- gltf-model est posé par src/home.js, depuis le blob préchargé. -->
          <a-entity id="preview-model" rotation="0 -18 0"></a-entity>
          <!-- Position posée par src/home.js, d'après la taille réelle du modèle. -->
          <a-camera
            id="preview-camera"
            fov="30"
            look-controls="enabled: false"
            wasd-controls="enabled: false"></a-camera>
        </a-scene>
      </div>

      <div id="anim-picker">
        <button type="button" id="anim-prev" aria-label="Animation précédente">‹</button>
        <div id="anim-current">
          <p id="anim-name" aria-live="polite">—</p>
          <div id="anim-dots" role="tablist" aria-label="Choix de l'animation"></div>
        </div>
        <button type="button" id="anim-next" aria-label="Animation suivante">›</button>
      </div>
    </section>

    <p class="hint">
      Ouvre cette page sur un téléphone, en HTTPS.<br>
      L'accès à la caméra est demandé au lancement.
    </p>
  </main>
  <script type="module" src="/src/home.js"></script>
</body>
</html>
