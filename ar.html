<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Mimosa AR — vue</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2213%22>🟡</text></svg>">
  <link rel="stylesheet" href="/src/style.css">

  <!--
    A-Frame, puis xrextras, puis le moteur — les trois s'exposent en globales
    (AFRAME / XRExtras / XR8). data-preload-chunks="slam" charge le tracking
    monde + image targets.

    xr.js est `async` (obligatoire) : il enregistre les composants A-Frame dès
    son exécution, mais n'assigne `window.XR8` qu'après l'init du wasm. Chargé
    en synchrone, A-Frame attache `xrconfig` avant que XR8 n'existe, son init()
    lève une ReferenceError et toute l'initialisation de la scène s'arrête.
    Conséquence : les composants AR ne sont PAS dans le HTML ci-dessous, c'est
    src/ar.js qui les attache une fois le moteur réellement prêt.
  -->
  <script src="external/aframe/aframe-master.min.js"></script>
  <script src="external/xrextras/xrextras.js"></script>
  <script src="external/xr/xr.js" async data-preload-chunks="slam" crossorigin="anonymous"></script>

  <script type="module" src="/src/ar.js"></script>
</head>
<body class="ar">
  <a id="back" href="./" aria-label="Retour">←</a>

  <!-- Les composants 8th Wall sont ajoutés par src/ar.js (voir commentaire ci-dessus). -->
  <a-scene
    renderer="colorManagement: true; antialias: true"
    device-orientation-permission-ui="enabled: false"
    vr-mode-ui="enabled: false">

    <!-- timeout: 0 — pas d'abandon sur réseau lent, le modèle est indispensable. -->
    <a-assets timeout="0">
      <a-asset-item id="model" src="models/eric.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 3 0" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse"></a-camera>

    <!--
      A-Frame 1.8 est en éclairage physiquement correct : l'intensité par
      défaut d'une lumière est 3.14, pas 1. Des valeurs autour de 1 donnent un
      rendu très sombre.
    -->
    <a-light type="hemisphere" color="#eaf2ff" ground-color="#8a6f4a" intensity="2.2"></a-light>
    <a-light type="directional" intensity="2.8" position="1.5 4 2.5" castShadow="true"></a-light>
    <a-light type="directional" intensity="1" position="-2 1.5 -1.5"></a-light>

    <!-- ÉTAPE 1 — tracking du monde : le sol reçoit les taps pour poser l'objet. -->
    <a-entity id="world">
      <a-entity
        id="ground"
        class="cantap"
        geometry="primitive: box; height: 0.05; width: 1000; depth: 1000"
        position="0 -0.025 0"
        material="shader: shadow; transparent: true; opacity: 0.4"
        shadow="receive: true"></a-entity>
    </a-entity>

    <!--
      ÉTAPE 2 — cible image sur le cylindre en carton.
      `name` doit correspondre au nom du target généré par le CLI
      (voir public/image-targets/README.md). Tant qu'aucun JSON n'est présent,
      cette entité reste simplement invisible.
    -->
    <a-entity id="cylinder-target" xrextras-named-image-target="name: cylindre">
      <!--
        Repère de calage : épouse la courbure réelle de la cible.
        Masqué par défaut (il se superposerait au modèle) — `?debug` l'affiche.
      -->
      <a-entity
        id="target-outline"
        visible="false"
        xrextras-target-mesh="geometry: label"
        material="color: #ffd34d; opacity: 0.25; transparent: true"></a-entity>

      <!--
        L'objet 3D accroché au cylindre. Y = axe du cylindre, origine au centre
        du visuel. Taille et position sont calées au runtime par src/ar.js sur
        la géométrie réelle de la cible : ne pas mettre de scale en dur ici, les
        unités du repère de la cible ne sont pas des mètres.
      -->
      <!--
        Ni scale ni position ici : src/ar.js ajuste le modèle à la géométrie
        réelle de la cible une fois celle-ci détectée.
      -->
      <!--
        rotation 180° sur X : l'axe Y du repère de la cible pointe vers le bas
        (vérifié sur appareil — le modèle sortait la tête en bas alors qu'il est
        à l'endroit dans son propre repère). Ajuster le 2e angle pour l'orienter.
      -->
      <a-entity id="cylinder-content" rotation="180 0 0">
        <a-entity id="cylinder-model" gltf-model="#model"></a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <!--
    Loader maison. `xrextras-loading` ne convient pas ici : son init() s'abonne
    à l'événement `loaded` de la scène, or on attache les composants 8th Wall
    après coup (cf. commentaire en tête de fichier) — l'événement est déjà passé
    et son écran ne se masque jamais.
  -->
  <div id="loader">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loader-text">Démarrage de la réalité augmentée…</p>
  </div>

  <div id="ui">
    <p id="status">Initialisation…</p>
  </div>
</body>
</html>
